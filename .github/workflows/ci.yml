name: Frontend CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typprüfung, Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Versions-Tag prüfen
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Erwartet wird eine stabile Version wie 1.0.0 (ohne v-Präfix)."
            exit 1
          fi
          if (( ${#GITHUB_REF_NAME} > 128 )); then
            echo "Der Docker-Tag darf maximal 128 Zeichen enthalten."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten aus Lockfile installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Tests einmalig ausführen
        run: npm test -- --watchAll=false --runInBand

      # Generated OpenAPI clients are committed; a live backend is not needed.
      - name: Produktionsbuild erstellen
        env:
          REACT_APP_API_URL: '/'
        run: npm run build

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Docker-Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: relin-frontend:ci

      - name: Frontend-Container und API-Proxy prüfen
        run: bash scripts/test-docker.sh relin-frontend:ci

      - name: Bei Docker Hub anmelden
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publish the exact image that passed the smoke test.
      - name: Geprüftes Image mit Versions-Tag veröffentlichen
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="$DOCKERHUB_USERNAME/own-webshop-frontend:$GITHUB_REF_NAME"
          docker tag relin-frontend:ci "$image"
          docker push "$image"
